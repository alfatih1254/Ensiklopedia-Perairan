<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 Ocean Explorer - Selami Kedalaman Laut</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: #000;
    overflow-x: hidden;
    color: white;
    cursor: default;
  }

  .ocean-container {
    position: relative;
    width: 100%;
    height: 12000px;
    background: linear-gradient(
      to bottom,
      #87CEEB 0%,
      #4A90E2 2%,
      #2E5C8A 5%,
      #1E3A5F 8%,
      #0F2847 12%,
      #0A1F3D 18%,
      #061530 25%,
      #030D1F 35%,
      #020814 45%,
      #010510 55%,
      #000308 65%,
      #000205 75%,
      #000103 85%,
      #000000 100%
    );
  }

  /* Light rays at surface */
  .light-rays {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 800px;
    background: 
      linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%),
      repeating-linear-gradient(90deg, transparent 0px, transparent 80px, rgba(255,255,255,0.05) 80px, rgba(255,255,255,0.05) 100px);
    pointer-events: none;
  }

  /* Bubbles */
  .bubble {
    position: absolute;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    animation: rise 10s infinite ease-in;
    pointer-events: none;
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-200px) translateX(30px) scale(1.1); }
    100% { transform: translateY(-400px) translateX(-20px) scale(0.8); opacity: 0; }
  }

  /* Depth indicator - modern glassmorphism */
  .depth-indicator {
    position: fixed;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(10, 20, 40, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 25px;
    border-radius: 20px;
    border: 1px solid rgba(0, 255, 255, 0.3);
    z-index: 100;
    min-width: 220px;
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .depth-value {
    font-size: 2.8em;
    font-weight: 900;
    background: linear-gradient(135deg, #00ffff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 5px;
    font-family: 'Courier New', monospace;
  }

  .depth-label {
    font-size: 0.85em;
    color: #8892b0;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .pressure-value {
    font-size: 2em;
    font-weight: 700;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 5px;
    font-family: 'Courier New', monospace;
  }

  .pressure-label {
    font-size: 0.8em;
    color: #8892b0;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .zone-indicator {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    font-size: 0.9em;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.3);
  }

  .progress-bar {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 400px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    z-index: 100;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(180deg, #00ffff, #00ff88, #ffd700);
    border-radius: 3px;
    transition: height 0.3s;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
  }

  .scroll-hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 20, 40, 0.8);
    backdrop-filter: blur(20px);
    padding: 15px 30px;
    border-radius: 25px;
    border: 1px solid rgba(0, 255, 255, 0.4);
    z-index: 100;
    text-align: center;
    animation: bounce 2s infinite;
    box-shadow: 0 8px 32px rgba(0, 255, 255, 0.2);
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-10px); }
  }

  .scroll-hint p {
    color: #00ffff;
    font-weight: 700;
    font-size: 1em;
  }

  .scroll-hint small {
    color: #8892b0;
    font-size: 0.8em;
  }

  /* Animal cards */
  .animal {
    position: absolute;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .animal:hover {
    transform: scale(1.4);
    z-index: 50;
  }

  .animal-emoji {
    font-size: 3.5em;
    display: block;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.5));
  }

  .animal:hover .animal-emoji {
    filter: drop-shadow(0 0 25px rgba(0, 255, 255, 0.9));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(2deg); }
    75% { transform: translateY(-4px) rotate(-2deg); }
  }

  .animal-name {
    background: rgba(10, 20, 40, 0.85);
    backdrop-filter: blur(10px);
    padding: 5px 12px;
    border-radius: 15px;
    font-size: 0.8em;
    font-weight: 700;
    color: #00ffff;
    white-space: nowrap;
    margin-top: 5px;
    border: 1px solid rgba(0, 255, 255, 0.3);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    opacity: 0.9;
  }

  .animal:hover .animal-name {
    opacity: 1;
    background: rgba(0, 255, 255, 0.2);
  }

  /* Depth markers */
  .depth-marker {
    position: absolute;
    left: 250px;
    width: calc(100% - 550px);
    border-top: 1px dashed rgba(255, 255, 255, 0.2);
    padding: 5px 10px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.85em;
    font-weight: 600;
    font-family: 'Courier New', monospace;
  }

  .zone-label {
    position: absolute;
    right: 50px;
    background: rgba(10, 20, 40, 0.8);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    border-radius: 12px;
    border-left: 4px solid;
    font-size: 0.95em;
    font-weight: 700;
    color: white;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  /* Modal - Modern glassmorphism */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal.show {
    display: flex;
    animation: fadeIn 0.4s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: linear-gradient(135deg, rgba(10, 25, 50, 0.95), rgba(0, 15, 30, 0.95));
    backdrop-filter: blur(30px);
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-radius: 25px;
    max-width: 650px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 35px;
    position: relative;
    animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 
      0 20px 60px rgba(0, 0, 0, 0.8),
      0 0 60px rgba(0, 255, 255, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .modal-content::-webkit-scrollbar { width: 6px; }
  .modal-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 3px; }
  .modal-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ffff, #00ff88); border-radius: 3px; }

  @keyframes slideUp {
    from { transform: translateY(80px) scale(0.9); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 0, 100, 0.2);
    border: 1px solid rgba(255, 0, 100, 0.5);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.3em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .modal-close:hover {
    background: rgba(255, 0, 100, 0.5);
    transform: rotate(90deg) scale(1.1);
  }

  .modal-header {
    text-align: center;
    margin-bottom: 25px;
    padding-bottom: 25px;
    border-bottom: 1px solid rgba(0, 255, 255, 0.2);
  }

  .modal-emoji {
    font-size: 7em;
    margin-bottom: 15px;
    display: block;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.6));
  }

  .modal-title {
    font-size: 2.3em;
    background: linear-gradient(135deg, #00ffff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .modal-latin {
    color: #8892b0;
    font-style: italic;
    font-size: 1.05em;
  }

  .modal-depth {
    background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.15));
    border: 1px solid rgba(255, 215, 0, 0.4);
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 25px;
    color: #ffd700;
    font-weight: 700;
    font-size: 1.05em;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .modal-depth span {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-section {
    margin-bottom: 25px;
  }

  .info-section h3 {
    background: linear-gradient(135deg, #00ff88, #00ffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 1.3em;
    margin-bottom: 15px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .info-text {
    color: #e0e0e0;
    line-height: 1.8;
    font-size: 1em;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  .info-card {
    background: rgba(0, 255, 255, 0.08);
    border: 1px solid rgba(0, 255, 255, 0.2);
    padding: 18px;
    border-radius: 15px;
    transition: all 0.3s;
  }

  .info-card:hover {
    background: rgba(0, 255, 255, 0.15);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
  }

  .info-label {
    color: #8892b0;
    font-size: 0.8em;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .info-value {
    color: white;
    font-size: 1.15em;
    font-weight: 700;
  }

  .facts-list {
    list-style: none;
    padding: 0;
  }

  .facts-list li {
    padding: 12px 0 12px 35px;
    position: relative;
    color: #e0e0e0;
    line-height: 1.6;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 0.95em;
  }

  .facts-list li::before {
    content: '🌊';
    position: absolute;
    left: 0;
    font-size: 1.1em;
  }

  .facts-list li:last-child {
    border-bottom: none;
  }

  @media (max-width: 768px) {
    .depth-indicator {
      left: 10px;
      min-width: 160px;
      padding: 15px;
    }
    .depth-value { font-size: 2em; }
    .pressure-value { font-size: 1.4em; }
    .animal-emoji { font-size: 2.5em; }
    .modal-emoji { font-size: 4.5em; }
    .modal-title { font-size: 1.6em; }
    .info-grid { grid-template-columns: 1fr; }
    .progress-bar { display: none; }
    .depth-marker { left: 180px; width: calc(100% - 200px); }
    .zone-label { right: 10px; font-size: 0.8em; padding: 8px 12px; }
  }
</style>
</head>
<body>

<div class="ocean-container" id="oceanContainer">
  <div class="light-rays"></div>
</div>

<div class="depth-indicator">
  <div class="depth-value" id="depthValue">0m</div>
  <div class="depth-label">Kedalaman</div>
  <div class="pressure-value" id="pressureValue">1.0 atm</div>
  <div class="pressure-label">Tekanan Air</div>
  <div class="zone-indicator" id="zoneIndicator">🌊 Permukaan</div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="height: 0%;"></div>
</div>

<div class="scroll-hint" id="scrollHint">
  <p>⬇️ Scroll untuk menyelam</p>
  <small>Klik hewan untuk info detail</small>
</div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

const ZONES = [
  { depth: 0, name: '🌊 Epipelagic (Sunlight Zone)', color: '#87CEEB', desc: '0-200m • Cahaya matahari masih masuk' },
  { depth: 200, name: '🌅 Mesopelagic (Twilight Zone)', color: '#4A90E2', desc: '200-1000m • Cahaya remang-remang' },
  { depth: 1000, name: ' Bathypelagic (Midnight Zone)', color: '#1E3A5F', desc: '1000-4000m • Kegelapan total' },
  { depth: 4000, name: '🌑 Abyssopelagic (Abyssal Zone)', color: '#061530', desc: '4000-6000m • Dasar laut dalam' },
  { depth: 6000, name: '⚫ Hadalpelagic (Trenches)', color: '#000103', desc: '6000-11000m • Palung terdalam' }
];

const oceanContainer = document.getElementById('oceanContainer');

// Create bubbles
for (let i = 0; i < 30; i++) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const size = Math.random() * 20 + 10;
  bubble.style.width = size + 'px';
  bubble.style.height = size + 'px';
  bubble.style.left = Math.random() * 100 + '%';
  bubble.style.top = Math.random() * 2000 + 'px';
  bubble.style.animationDelay = Math.random() * 10 + 's';
  bubble.style.animationDuration = (Math.random() * 10 + 8) + 's';
  oceanContainer.appendChild(bubble);
}

// Create animals - FIXED POSITIONING
ANIMALS.forEach((animal, index) => {
  const animalEl = document.createElement('div');
  animalEl.className = 'animal';
  // Convert depth (meters) to pixels - 1m = 1px
  animalEl.style.top = animal.depth + 'px';
  // Alternate left/right positioning for better distribution
  const leftPos = 10 + (index % 5) * 18 + Math.random() * 5;
  animalEl.style.left = leftPos + '%';
  animalEl.onclick = () => showAnimalDetail(index);
  
  animalEl.innerHTML = `
    <span class="animal-emoji">${animal.emoji}</span>
    <div class="animal-name">${animal.name}</div>
  `;
  
  oceanContainer.appendChild(animalEl);
});

// Create depth markers
const markerDepths = [0, 500, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 10994];
markerDepths.forEach(depth => {
  const marker = document.createElement('div');
  marker.className = 'depth-marker';
  marker.style.top = depth + 'px';
  marker.textContent = `━━━ ${depth}m ━━`;
  oceanContainer.appendChild(marker);
});

// Create zone labels
ZONES.forEach(zone => {
  const label = document.createElement('div');
  label.className = 'zone-label';
  label.style.top = (zone.depth + 80) + 'px';
  label.style.borderLeftColor = zone.color;
  label.innerHTML = `<div style="font-size: 1.1em; margin-bottom: 3px;">${zone.name}</div><div style="font-size: 0.75em; color: #8892b0; font-weight: 500;">${zone.desc}</div>`;
  oceanContainer.appendChild(label);
});

// Scroll handler
window.addEventListener('scroll', () => {
  const scrollY = window.scrollY;
  const maxScroll = 10994;
  const depth = Math.min(scrollY, maxScroll);
  const pressure = (1 + depth / 10).toFixed(1);
  const progress = (depth / maxScroll) * 100;
  
  document.getElementById('depthValue').textContent = Math.floor(depth) + 'm';
  document.getElementById('pressureValue').textContent = pressure + ' atm';
  document.getElementById('progressFill').style.height = progress + '%';
  
  // Update zone
  let currentZone = ZONES[0];
  for (let i = ZONES.length - 1; i >= 0; i--) {
    if (depth >= ZONES[i].depth) {
      currentZone = ZONES[i];
      break;
    }
  }
  document.getElementById('zoneIndicator').innerHTML = `<div style="font-size: 1.1em;">${currentZone.name}</div><div style="font-size: 0.75em; color: #8892b0; margin-top: 3px;">${currentZone.desc}</div>`;
  document.getElementById('zoneIndicator').style.color = currentZone.color;
  document.getElementById('zoneIndicator').style.borderColor = currentZone.color;
  
  // Hide scroll hint after scrolling
  if (scrollY > 100) {
    document.getElementById('scrollHint').style.opacity = '0';
    document.getElementById('scrollHint').style.pointerEvents = 'none';
  } else {
    document.getElementById('scrollHint').style.opacity = '1';
    document.getElementById('scrollHint').style.pointerEvents = 'auto';
  }
});

function showAnimalDetail(index) {
  const animal = ANIMALS[index];
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  
  const pressure = (1 + animal.depth / 10).toFixed(1);
  
  // Find zone
  let currentZone = ZONES[0];
  for (let i = ZONES.length - 1; i >= 0; i--) {
    if (animal.depth >= ZONES[i].depth) {
      currentZone = ZONES[i];
      break;
    }
  }
  
  content.innerHTML = `
    <button class="modal-close" onclick="closeModal()"></button>
    
    <div class="modal-header">
      <span class="modal-emoji">${animal.emoji}</span>
      <h2 class="modal-title">${animal.name}</h2>
      <p class="modal-latin">${animal.latin}</p>
    </div>
    
    <div class="modal-depth">
      <span> ${animal.depth}m</span>
      <span>⚡ ${pressure} atm</span>
      <span>🌊 ${currentZone.name.split(' ').slice(1).join(' ')}</span>
    </div>
    
    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">⏱️ Umur</div>
        <div class="info-value">${animal.lifespan}</div>
      </div>
      <div class="info-card">
        <div class="info-label">📏 Ukuran</div>
        <div class="info-value">${animal.size}</div>
      </div>
      <div class="info-card">
        <div class="info-label">🍽️ Makanan</div>
        <div class="info-value">${animal.diet}</div>
      </div>
      <div class="info-card">
        <div class="info-label"> Kedalaman</div>
        <div class="info-value">${animal.depth} meter</div>
      </div>
    </div>
    
    <div class="info-section">
      <h3>📖 Tentang ${animal.name}</h3>
      <p class="info-text">${animal.description}</p>
    </div>
    
    <div class="info-section">
      <h3>✨ Fakta Menarik</h3>
      <ul class="facts-list">
        ${animal.facts.map(fact => `<li>${fact}</li>`).join('')}
      </ul>
    </div>
  `;
  
  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) {
    closeModal();
  }
});
</script>
